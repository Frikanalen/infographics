# Serves the built template, and passes requests on to data sources that a
# web page cannot call by itself.
#
# A browser will not let a page choose its own User-Agent, and MET Norway
# asks every client to identify itself and to cache what it fetches. So the
# template asks this server for met/... next to itself, and this server asks
# MET. The template lives under /infographics/, the path it has on
# frikanalen.tv.
# vite.config.ts does the same during development: keep the two alike.

proxy_cache_path /var/cache/nginx/data keys_zone=data:1m max_size=50m inactive=6h;

server {
    listen 80;
    root /usr/share/nginx/html;

    absolute_redirect off;
    location = / {
        return 302 /infographics/;
    }
    location = /infographics {
        return 302 /infographics/;
    }
    location /infographics/ {
        try_files $uri $uri/ =404;
    }

    # https://api.met.no/weatherapi/ and nothing else on that host.
    location /infographics/met/ {
        limit_except GET { deny all; }
        proxy_pass https://api.met.no/weatherapi/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.met.no;
        proxy_set_header User-Agent "frikanalen-infographics/0.1 github.com/Frikanalen/infographics";
        proxy_set_header Cookie "";

        # MET says how long each answer is good for; nginx follows that.
        # If MET is slow or down, keep serving the last answer. The template
        # drops the module once its data is too old.
        proxy_cache data;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status;
    }

    # https://driftsdata.statnett.no/restapi/ and nothing else on that host.
    # Statnett sends no CORS header, so the page cannot ask it directly.
    # Statnett says no-cache; the flows change every few minutes, so keep an
    # answer for 30 seconds at most, and the last one if Statnett is down.
    location /infographics/statnett/ {
        limit_except GET { deny all; }
        proxy_pass https://driftsdata.statnett.no/restapi/;
        proxy_ssl_server_name on;
        proxy_set_header Host driftsdata.statnett.no;
        proxy_set_header User-Agent "frikanalen-infographics/0.1 github.com/Frikanalen/infographics";
        proxy_set_header Cookie "";

        proxy_cache data;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status;
    }

    # https://data.stortinget.no/eksport/ and nothing else on that host.
    # The Storting's open data, at most 100 calls a minute. The meeting plan
    # and agendas change a few times a day, so keep an answer for ten
    # minutes, and the last one if the source is down.
    location /infographics/stortinget/ {
        limit_except GET { deny all; }
        proxy_pass https://data.stortinget.no/eksport/;
        proxy_ssl_server_name on;
        proxy_set_header Host data.stortinget.no;
        proxy_set_header User-Agent "frikanalen-infographics/0.1 github.com/Frikanalen/infographics";
        proxy_set_header Cookie "";

        proxy_cache data;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status;
    }
}
